services:
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techmax_php
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: techmax
      DB_PASS: techmax
      DB_NAME: techmax_app
    volumes:
      - ./backend/api:/var/www/html/api
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    container_name: techmax_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: techmax_app
      MARIADB_USER: techmax
      MARIADB_PASSWORD: techmax
    volumes:
      - techmax_db_data:/var/lib/mysql
      - ./backend/database.sql:/docker-entrypoint-initdb.d/001-database.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: techmax_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy

volumes:
  techmax_db_data:
